version: "3.9"

services:
  app:
    image: user-crud-app        # the image you built with `docker build -t user-crud-app .`
    container_name: user-crud-app
    ports:
      - "8080:8080"             # map host port 8080 to container port 8080
    env_file:
      - .env                    # load environment variables from a local .env file
    restart: unless-stopped
