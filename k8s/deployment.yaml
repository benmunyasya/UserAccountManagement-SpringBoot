apiVersion: apps/v1
kind: Deployment
metadata:
  name: useraccountmanagement-deployment
  labels:
    app: useraccountmanagement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: useraccountmanagement
  template:
    metadata:
      labels:
        app: useraccountmanagement
    spec:
      containers:
      - name: useraccountmanagement
        image: benngovi47/useraccountmanagement:1.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: useraccountmanagement-config
        - secretRef:
            name: useraccountmanagement-secret
